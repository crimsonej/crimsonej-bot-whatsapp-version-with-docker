version: '3.8'

services:
  crimson-bot:
    build:
      context: .
      dockerfile: ./crimson-bot/Dockerfile
    container_name: crimson-bot
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - BOT_PORT=5000
    volumes:
      - bot_data:/data

  whatsapp-bridge:
    build:
      context: .
      dockerfile: ./whatsapp-bridge/Dockerfile
    container_name: whatsapp-bridge
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
      - AI_SERVER=http://crimson-bot:5000/reply
      - AUTH_DIR=/data/auth_info_baileys
    volumes:
      - bridge_data:/data
    depends_on:
      - crimson-bot

volumes:
  bot_data:
  bridge_data:
