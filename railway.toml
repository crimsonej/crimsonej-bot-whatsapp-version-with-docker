# Railway Deployment Configuration

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on-failure"
restartPolicyMaxRetries = 10

[services.crimson-bot]
# Main unified bot container
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[services.crimson-bot.variables]
PORT = "7860"
BOT_PORT = "5000"
MEDIA_ROOT = "/media"
DATA_DIR = "/data"
# Required - add in Railway dashboard:
# NVIDIA_API_KEY
# GROQ_API_KEY
# HF_API_KEY (optional)
# GITHUB_TOKEN (for backup sync)
# GITHUB_BACKUP_REPO (e.g., crimsonej/crimsonej-data)
# CRIMSON_API_TOKEN (shared secret for bridge)
# CREATOR_PHONE (your WhatsApp number digits)

[services.crimson-bot.volumes]
bot_data = "/data"
media_data = "/media"