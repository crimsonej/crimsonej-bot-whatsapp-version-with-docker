# Railway Deployment Configuration

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on-failure"
restartPolicyMaxRetries = 10

[services.crimson-bot]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[services.crimson-bot.variables]
PORT = "7860"
BOT_PORT = "5000"
MEDIA_ROOT = "/media"
DATA_DIR = "/data"
AUTH_DIR = "/data/auth_info_baileys"
BOT_NAME = "crimsonej"
MODEL = "meta/llama-3.2-90b-vision-instruct"
# Required - Add in Railway Dashboard:
# NVIDIA_API_KEY = "nvapi-..."
# GROQ_API_KEY = "gsk_..."
# CREATOR_PHONE = "123456789012"

[services.crimson-bot.volumes]
bot_data = "/data"
media_data = "/media"